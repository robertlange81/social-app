<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="swirl" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="vivid" values="
        3 0 0 0 -0.6
        0 3 0 0 -0.6
        0 0 3 0 -0.6
        0 0 0 0.8 0"/>
      <feGaussianBlur in="vivid" stdDeviation="1.4"/>
    </filter>

    <radialGradient id="blobMagenta" cx="26%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="80%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="72%" cy="78%" r="46%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobOrange" cx="20%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#ff9f1c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobYellow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#ffe66d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe66d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ring1" cx="50%" cy="46%" r="20%">
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring2" cx="50%" cy="46%" r="34%">
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="86%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#1a0b2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#1a0b2e"/>
  <rect width="1200" height="1200" filter="url(#swirl)" opacity="0.5"/>

  <rect width="1200" height="1200" fill="url(#blobMagenta)"/>
  <rect width="1200" height="1200" fill="url(#blobCyan)"/>
  <rect width="1200" height="1200" fill="url(#blobPurple)"/>
  <rect width="1200" height="1200" fill="url(#blobOrange)"/>
  <rect width="1200" height="1200" fill="url(#blobYellow)"/>

  <rect width="1200" height="1200" fill="url(#ring1)"/>
  <rect width="1200" height="1200" fill="url(#ring2)"/>

  <rect width="1200" height="1200" fill="url(#vignette)"/>
</svg>
